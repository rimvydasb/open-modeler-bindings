name: Release Demos

on:
  push:
    branches:
      - main
    paths:
      - 'demo/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases and tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for tag checks

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Publish Demos to Artifactory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/publish-to-artifactory.ts
